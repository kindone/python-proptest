name: python-proptest Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run bandit security linter
      run: |
        bandit -r python_proptest/ -s B311,B110 -f json -o bandit-report.json || true
        bandit -r python_proptest/ -s B311,B110

    - name: Run safety scan
      env:
        SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
      run: |
        if [ -z "${SAFETY_API_KEY:-}" ]; then
          echo "SAFETY_API_KEY is not configured; skipping Safety scan."
          printf '{"skipped": true, "reason": "SAFETY_API_KEY is not configured"}\n' > safety-report.json
          exit 0
        fi
        safety --key "$SAFETY_API_KEY" --stage cicd scan --save-as json safety-report.json

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
